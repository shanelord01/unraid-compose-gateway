name: ucg
version: 0.4.0
description: >-
  Tools for talking to a running unraid-compose-gateway sidecar: start, stop,
  restart, and pull images for specific Docker Compose projects (each with
  its Unraid Compose Manager "Auto Start" state so an agent can tell whether
  the operator wants it to actually come back up); read container logs;
  check for available Unraid plugin updates; and clean up dangling images
  left behind by repeated pull/up cycles. The sidecar enforces its own
  allowlist and a self-exclude list server-side, so this plugin cannot make
  the agent's own project reachable by asking differently - the boundary
  lives in the sidecar, not here. Mutating tools (restart, up, down, pull,
  prune) are only registered when GATEWAY_ALLOW_WRITES is set; read tools
  and plugin-update detection are always available once the sidecar is
  reachable.
author: Shane Lord
provides_tools:
  # Always registered once GATEWAY_URL and GATEWAY_TOKEN are set.
  - ucg_whoami
  - ucg_projects
  - ucg_status
  - ucg_logs
  - ucg_plugin_updates
  # Registered only when GATEWAY_ALLOW_WRITES is true.
  - ucg_restart
  - ucg_up
  - ucg_down
  - ucg_pull
  - ucg_prune_dangling_images
requires_env:
  - name: GATEWAY_URL
    description: "Base URL of the unraid-compose-gateway instance, e.g. http://unraid-compose-gateway:8080"
    secret: false
    note: "Can also be set from the UCG dashboard tab."
  - name: GATEWAY_TOKEN
    description: "Bearer token the gateway was started with (its own GATEWAY_TOKEN setting - see the gateway's .env.example)"
    secret: true
    note: "Can also be set from the UCG dashboard tab."
optional_env:
  - name: GATEWAY_ALLOW_WRITES
    description: "Set to true to register the mutating tools (restart, up, down, pull, prune_dangling_images). Defaults to false - read-only - matching the gateway's own default-safe posture. The gateway's own SELF_EXCLUDE_PROJECTS is enforced regardless of this setting; this only controls whether the agent can attempt writes at all."
    prompt: "Allow compose control? (true/false)"
    secret: false
    note: "Can also be toggled from the UCG dashboard tab - either way, a Hermes gateway restart is required for the change in registered tools to take effect."
  - name: GATEWAY_TIMEOUT_SECONDS
    description: "HTTP timeout in seconds for READ calls to the gateway - whoami, projects, status, logs, plugin updates (default 30). These answer fast; compose actions use GATEWAY_LONG_TIMEOUT_SECONDS instead."
    secret: false
    note: "Can also be set from the UCG dashboard tab."
  - name: GATEWAY_LONG_TIMEOUT_SECONDS
    description: "HTTP timeout in seconds for calls that run a command on the gateway - up, down, restart, pull, prune_dangling_images (default 600). Must stay comfortably ABOVE the gateway's own COMPOSE_TIMEOUT_SECONDS (default 120) so the gateway, not this client, is what decides an operation has failed; a shorter value here reports false failures for work the gateway goes on to complete. Floored at GATEWAY_TIMEOUT_SECONDS."
    secret: false
    note: "Not shown in the UCG dashboard tab yet - set it via environment. Saving from the dashboard will not clear it."
